    <div class="container-fluid mt-4">
        <h2 class="text-center mb-4">Restaurant Listing</h2>
        <div class=" row ">
          <div class="col-md-4 mb-4"  
            *ngFor="let restaurant of restaurantList "
          >
            <div class=" mb-4 " >
                <div class="card ">
                    <div class="card-body h-100">
                        <img src="{{getRandomImages()}}" width="200px" height="200px" class="card-img-tag  w-100 border   " alt="Restaurant Image">
                        <h5 class="card-title text-center">{{restaurant.name}} Dev </h5>
                        <p class="card-text">Address: {{restaurant.address}}</p>
                        <p class="card-text">City: {{restaurant.city}}</p>
                        <p class="card-text">Description: {{restaurant.restaurantDescription}}</p>
                        <div class ="">
                            <span class="rating"> <i class=" fa fa-star "></i>4.5</span>
                            <span class=" rating-count"> (500+)</span>
                        </div>
                        <div class="text-center ">
                            <button class="btn btn-warning " (click)="onButtonClick(restaurant.id)" >Order Now</button>
                        </div>

                        <!-- <button class="btn btn-primary" (click)="viewMenu(restaurant.id)">View Menu</button>     -->

                    </div>
                </div>
            </div>
        </div>   
               
    </div>
</div>
